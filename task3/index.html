<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
}

.container {
    width: 90%;
    max-width: 400px;
    padding: 30px;
    background: white;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

h1 {
    color: #0072ff;
    font-size: 28px;
    margin-bottom: 10px;
}

p {
    color: #666;
    margin-bottom: 20px;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #0072ff;
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0053bd;
}

h2 {
    margin-top: 20px;
    font-size: 19px;
    color: #222;
    overflow-wrap: anywhere;
}
</style>
</head>
<body>

    <div class="container">
        <h1>Temperature Converter</h1>
        <p>Convert temperature easily</p>

        <input type="number" id="temperature"
               placeholder="Enter temperature">

        <select id="fromUnit">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
        </select>

        <select id="toUnit">
            <option value="F">Fahrenheit (°F)</option>
            <option value="C">Celsius (°C)</option>
            <option value="K">Kelvin (K)</option>
        </select>

        <button onclick="convertTemperature()">
            Convert
        </button>

        <h2 id="result">Result will appear here</h2>
    </div>

    <script >

        function convertTemperature() {
    const input = document.getElementById("temperature").value;
    const from = document.getElementById("fromUnit").value;
    const to = document.getElementById("toUnit").value;
    const result = document.getElementById("result");

    if (input.trim() === "") {
        result.textContent = "Please enter a temperature!";
        return;
    }

    const temperature = Number(input);

    // Convert input to Celsius first
    let celsius;

    if (from === "C") {
        celsius = temperature;
    } else if (from === "F") {
        celsius = (temperature - 32) * 5 / 9;
    } else {
        celsius = temperature - 273.15;
    }

    // Reject temperatures below absolute zero
    if (celsius < -273.15) {
        result.textContent = "Invalid temperature!";
        return;
    }

    // Convert Celsius to the selected unit
    let converted;

    if (to === "C") {
        converted = celsius;
    } else if (to === "F") {
        converted = (celsius * 9 / 5) + 32;
    } else {
        converted = celsius + 273.15;
    }

    result.textContent =
        "Result: " + Number(converted.toFixed(2)) + " °" + to;
}
    </script>
</body>
</html>
